site_name: ikn-library
site_description: Python library of research and data-science tools, including nature-inspired metaheuristic algorithms for feature selection and parameter optimization
site_url: https://ikn-library.readthedocs.io/
repo_url: https://github.com/ismankrn/ikn-library
repo_name: ismankrn/ikn-library

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Algorithms: algorithms.md
  - Feature Selection: feature-selection.md
  - Multi-Objective Optimization: multiobjective.md
  - Hyperparameter Optimization: parameter-optimization.md
  - Microarray Data: microarray.md
  - Ensemble Weights: ensemble.md
  - Undersampling: undersampling.md
  - Molecule Data (SIDER): sider.md
  - Molecule Data (Tox21): tox21.md
  - Molecule Data (BBBP, ClinTox, HIV): moleculenet.md
  - Molecular Descriptors: featurize.md
  - SMILES to Sequences: smiles2vec.md
