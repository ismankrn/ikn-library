[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ikn-library"
version = "0.10.0"
description = "Python library of research and data-science tools, including nature-inspired metaheuristic algorithms for feature selection and parameter optimization"
readme = "README.md"
license = "MIT"
authors = [{ name = "Isman Kurniawan", email = "isman.krn@gmail.com" }]
requires-python = ">=3.9"
keywords = [
    "optimization",
    "metaheuristic",
    "ant-colony-optimization",
    "feature-selection",
    "hyperparameter-optimization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
]
chem = [
    "rdkit>=2023.9.1",
]
dev = [
    "pytest>=7.0",
    "ruff",
    "scikit-learn>=1.3",
    "rdkit>=2023.9.1",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/ismankrn/ikn-library"
Documentation = "https://ikn-library.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["src/ikn_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
