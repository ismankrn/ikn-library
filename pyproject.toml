[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ikn-library"
version = "0.1.0"
description = "Nature-inspired metaheuristic algorithms for feature selection and parameter optimization"
readme = "README.md"
license = "MIT"
authors = [{ name = "Isman Kurniawan", email = "isman.krn@gmail.com" }]
requires-python = ">=3.9"
keywords = [
    "optimization",
    "metaheuristic",
    "ant-colony-optimization",
    "feature-selection",
    "hyperparameter-optimization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.0",
    "ruff",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/ismankrn/ikn-library"

[tool.hatch.build.targets.wheel]
packages = ["src/ikn_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
